<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chessreal</title>
<style>
:root{--bg:#161512;--panel:#262421;--p2:#302e2b;--tx:#bababa;--hi:#fff;--acc:#629924;--lt:#f0d9b5;--dk:#b58863;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e8e6e1;--panel:#fff;--p2:#f1efeb;--tx:#4a4846;--hi:#161512;color-scheme:light}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
svg.ic{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
#app{display:flex;gap:22px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding:14px}
.bw{width:min(94vw,calc(100vh - 140px),640px);min-width:290px}
.bar{display:flex;align-items:center;gap:10px;height:42px;color:var(--hi);font-weight:600;transition:opacity .3s}
.bar img{width:32px;height:32px}.bar .dot{width:10px;height:10px;border-radius:50%;background:#555;margin-left:auto;transition:.3s}
.bar.on .dot{background:#7fd13b;box-shadow:0 0 10px #7fd13b}.bar:not(.on){opacity:.6}
.board{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.45)}
#sq{position:absolute;inset:0;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr)}
.s{position:relative;cursor:pointer}.s.l{background:var(--lt);color:var(--dk)}.s.d{background:var(--dk);color:var(--lt)}
.s[data-r]::before{content:attr(data-r);position:absolute;top:2px;left:3px;font:700 11px sans-serif}
.s[data-f]::after{content:attr(data-f);position:absolute;bottom:1px;right:3px;font:700 11px sans-serif}
.s.last{box-shadow:inset 0 0 0 100px rgba(155,199,0,.41)}.s.sel{box-shadow:inset 0 0 0 100px rgba(20,85,30,.5)}
.s.chk{background-image:radial-gradient(circle,#f33 0,#e00 30%,rgba(169,0,0,0) 85%);animation:chk 1s infinite alternate}
@keyframes chk{to{filter:brightness(1.35)}}
.m{position:absolute;pointer-events:none}.mv .m{inset:35%;border-radius:50%;background:rgba(20,85,0,.5)}
.cap .m{inset:0;border-radius:50%;background:radial-gradient(transparent 0,transparent 79%,rgba(20,85,0,.45) 80%)}
.sp .m{inset:22%;border-radius:50%;border:4px dashed #2d8cff;animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#pcs{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform .3s cubic-bezier(.3,.8,.3,1),opacity .3s}
.pc img{width:100%;height:100%;transition:transform .3s}
.pc b{position:absolute;right:3%;bottom:3%;min-width:30%;padding:0 3px;border-radius:9px;background:#262421;color:#fff;font:700 clamp(8px,1.8vw,12px)/1.5 sans-serif;text-align:center}
.pc.rdy b{background:var(--acc)}.pc.rdy img{animation:glow 1s infinite alternate}
@keyframes glow{to{filter:drop-shadow(0 0 7px #8fe03f) drop-shadow(0 0 3px #8fe03f)}}
.pc.pop img{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{from{transform:scale(0) rotate(-120deg)}}
.pc.promo img{animation:promo .7s}@keyframes promo{40%{transform:scale(1.5) rotate(180deg);filter:drop-shadow(0 0 12px gold)}}
.pc.dead{opacity:0}.pc.dead img{transform:scale(.3) rotate(40deg)}
.side{width:min(94vw,340px);background:var(--panel);border-radius:6px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.side h1{margin:0;padding:14px 16px;font:700 22px "Noto Sans",system-ui,sans-serif;color:var(--hi);display:flex;gap:8px;align-items:center;background:var(--p2)}
.side h1 svg{color:#f0b429}
#msg{padding:12px 16px;color:var(--hi);font-weight:600;border-bottom:1px solid var(--bg);min-height:48px}
#spawn{display:none;padding:8px 16px;gap:6px;align-items:center;background:var(--p2);animation:slide .25s}
#spawn.show{display:flex}@keyframes slide{from{opacity:0;transform:translateY(-6px)}}
#spawn button{width:42px;height:42px;padding:2px;border:2px solid transparent;border-radius:6px;background:var(--panel);cursor:pointer}
#spawn button.on{border-color:#2d8cff}#spawn img{width:100%}
#hist{height:210px;overflow:auto;padding:6px 0;font-size:14px}
#hist div{display:grid;grid-template-columns:34px 1fr 1fr;padding:3px 16px}#hist div:nth-child(odd){background:var(--p2)}#hist i{opacity:.5;font-style:normal}
#hist span:last-child{animation:slide .3s}
.btns{display:flex;gap:6px;padding:10px;background:var(--p2)}
button.b{flex:1;display:flex;gap:6px;justify-content:center;align-items:center;padding:10px 6px;border:0;border-radius:5px;background:var(--panel);color:var(--tx);font:600 13px inherit;cursor:pointer;transition:.15s}
button.b:hover,button.b:focus-visible{background:var(--acc);color:#fff;outline:0}
#modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.6);z-index:50;padding:16px}
#modal.show{display:grid;animation:fade .25s}@keyframes fade{from{opacity:0}}
.card{width:min(100%,400px);max-height:90vh;overflow:auto;background:var(--panel);border-radius:10px;padding:22px;color:var(--tx);box-shadow:0 20px 60px rgba(0,0,0,.6);animation:zoom .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes zoom{from{transform:scale(.8);opacity:0}}
.card h2{margin:0 0 4px;color:var(--hi);font-size:24px;display:flex;gap:8px;align-items:center}.card h2 svg{color:#f0b429}
.card p,.card li{margin:6px 0}.card ul{padding-left:18px;margin:8px 0}.card .r{margin:14px 0 6px;font-weight:600;color:var(--hi)}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px 4px;border:2px solid transparent;border-radius:6px;background:var(--p2);color:var(--tx);font:600 14px inherit;cursor:pointer;transition:.15s}
.seg button.on{border-color:var(--acc);color:var(--hi)}
.go{width:100%;margin-top:18px;padding:14px;border:0;border-radius:6px;background:var(--acc);color:#fff;font:700 18px inherit;cursor:pointer;transition:transform .15s}.go:hover{transform:scale(1.03)}
.hide{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.bd{display:flex;gap:8px}.board{flex:1;min-width:0}.eb{position:relative;width:24px;background:#403d39;border-radius:3px;overflow:hidden}
#ebw{position:absolute;left:0;right:0;background:#f4f4f4;height:50%;transition:height .6s cubic-bezier(.3,.8,.3,1)}
#ebl{position:absolute;left:0;right:0;bottom:4px;text-align:center;font:700 10px sans-serif;color:#fff;mix-blend-mode:difference}
#ar{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
#tg{position:absolute;left:0;top:0;width:12.5%;height:12.5%;z-index:8;pointer-events:none;display:none;transition:transform .3s}
#tg span{position:absolute;right:1%;top:1%;width:40%;height:40%;overflow:hidden;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 clamp(8px,1.7vw,13px) sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.5)}
#tg span.in{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#an{border-bottom:1px solid var(--bg)}.ah{display:flex;align-items:center;gap:8px;padding:8px 16px;color:var(--hi)}.ah span{margin-left:auto;font-size:12px;opacity:.7}
button.sm{flex:none;padding:4px 12px}
.tr{display:flex;align-items:center;gap:8px;padding:0 16px 6px;font-size:13px}.tr input{flex:1;accent-color:var(--acc)}
.ln{display:flex;align-items:center;gap:8px;padding:3px 16px;font-size:14px}.ln b{width:8px;height:8px;border-radius:50%}.ln span:first-of-type{width:46px;font-weight:700;color:var(--hi)}
#tgm{padding:8px 16px;font-size:13px;color:var(--hi)}#tgm:empty{display:none}.chip{display:inline-block;min-width:22px;padding:0 6px;border-radius:10px;text-align:center;font-weight:800;color:#fff}
#hist span[data-n]{cursor:pointer;border-radius:3px;padding:0 4px}#hist span.cur{background:var(--acc);color:#fff}#hist em{font-style:normal;font-weight:800}
#hist{height:150px}

#nav{display:flex;gap:4px;padding:8px 14px 0;max-width:1100px;margin:0 auto}
#nav button{display:flex;gap:6px;align-items:center;padding:10px 18px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--tx);font:600 15px inherit;cursor:pointer;transition:.15s}
#nav button:hover{color:var(--hi)}body.t-play [data-tab=play],body.t-analysis [data-tab=analysis]{color:var(--hi);border-bottom-color:var(--acc)}
body.t-play #an,body.t-play #loadp{display:none}body.t-analysis #spawn,body.t-analysis .po{display:none!important}
#loadp{padding:8px 16px;border-bottom:1px solid var(--bg);animation:slide .3s}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs button{flex:1;padding:6px;border:0;border-radius:5px;background:var(--p2);color:var(--tx);font:600 13px inherit;cursor:pointer}.tabs button.on{background:var(--acc);color:#fff}
#gl{max-height:120px;overflow:auto;font-size:13px}.gr{display:flex;gap:8px;padding:5px 6px;border-radius:4px;cursor:pointer;transition:.15s}.gr:hover{background:var(--p2)}.gr span:last-child{margin-left:auto;opacity:.7}.gr b{color:var(--hi)}
#pgn{width:100%;height:90px;resize:vertical;background:var(--p2);color:var(--tx);border:1px solid var(--bg);border-radius:5px;padding:6px;font:12px monospace}
#lerr{color:#e5534b;font-size:12px;margin-top:4px}#lerr:empty{display:none}.row{display:flex;gap:6px;margin-top:6px;align-items:center}progress{flex:1;accent-color:var(--acc)}
#tg svg{width:68%;height:68%}.chip{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}.chip svg,#hist em svg{width:14px;height:14px;vertical-align:-2px}
#lg{padding:0 16px 8px;display:flex;flex-wrap:wrap}.lc{display:inline-flex;align-items:center;gap:4px;font-size:11px;margin:2px 8px 2px 0}.lc i{font:800 10px sans-serif;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;color:#fff}.lc svg{width:11px;height:11px}
img.ti{display:block;object-fit:contain}#tg img{width:100%;height:100%;max-width:100%;max-height:100%}
#tg span:has(img.ti),.chip:has(img.ti),.lc i:has(img.ti){background:none!important;box-shadow:none}.chip:has(img.ti){padding:0}
</style></head><body>
<nav id="nav"><button data-tab="play"><i data-ic="play"></i> Play</button><button data-tab="analysis"><i data-ic="chart"></i> Analysis</button></nav>
<div id="app">
 <div class="bw"><div class="bar" id="top"></div><div class="bd"><div class="eb"><div id="ebw"></div><span id="ebl">0.0</span></div><div class="board"><div id="sq"></div><div id="pcs"></div><svg id="ar" viewBox="0 0 800 800"></svg><div id="tg"><span></span></div></div></div><div class="bar" id="bot"></div></div>
 <div class="side"><h1><i data-ic="crown"></i> Chessreal</h1><div id="msg"></div><div id="spawn"></div><div id="loadp"><div class="tabs"><button data-lt="games" class="on">My games</button><button data-lt="paste">Paste PGN / CRM</button></div><div id="gl"></div><div id="pst" style="display:none"><textarea id="pgn" placeholder="Paste a PGN or CRM here..."></textarea><div class="row"><button class="b" data-act="load">Load</button><button class="b" data-act="export">Export CRM</button></div></div><div id="lerr"></div><div class="row"><button class="b" id="rvb" data-act="review">Review whole game</button></div><div class="row"><progress id="prog" value="0" max="1" style="display:none"></progress></div></div><div id="an"><div class="ah"><i data-ic="cpu"></i><b>Engine</b><span id="dep"></span><button class="b sm" id="engb" data-act="eng">On</button></div><div id="anb"><div class="tr"><label for="tm">Think time</label><input type="range" id="tm" min="1" max="10" value="5"><b id="tmv">5s</b></div><div id="lines"></div><div id="tgm"></div><div id="lg"></div></div></div><div id="hist"></div>
  <div class="btns"><button class="b po" data-act="menu"><i data-ic="rotate"></i>New</button><button class="b" data-act="flip"><i data-ic="flip"></i>Flip</button><button class="b" data-act="rules"><i data-ic="book"></i>Rules</button><button class="b po" data-act="resign"><i data-ic="flag"></i>Resign</button></div></div>
</div>
<div id="modal"><div class="card" id="card"></div></div>

function analyze(){if(tab!=='analysis'||reviewing||!G)return;stopEng();if(!S.eng)return;const n=VI(),a=G.an[n];if(a&&a.done)return;runEng(G,n,S.sec*1000)}
function review(){if(reviewing){reviewing=0;stopEng();rvui();return}const g=G;if(!g.h.length)return;reviewing=1;
 (function step(i){if(!reviewing||g!==G)return;if(i>g.h.length){reviewing=0;rvui();refresh();return}rvI=i;rvui();const a=g.an[i];if(a&&a.done)return step(i+1);runEng(g,i,S.sec*1000,()=>step(i+1))})(0)}
function rvui(){const p=$('#prog');$('#rvb').textContent=reviewing?`Stop (${rvI}/${G.h.length})`:'Review whole game';p.style.display=reviewing?'':'none';p.max=Math.max(1,G.h.length);p.value=rvI}
/*CRM-START*/
const sqi=s=>F.indexOf(s[0])+(s[1]-1)*8;
function resolve(b,c,tk){if(/^O-O/.test(tk))throw'Castling does not exist in Chessreal';
 tk=tk.replace(/[+#!?]+$/,'').replace(/=[A-Za-z]$/,'');const all=gen(b,c);let m;
 if(m=tk.match(/^R([a-h][1-8])\+([QRBNP])([a-h][1-8])$/)){const f=sqi(m[1]),t=sqi(m[3]),sp=m[2].toLowerCase();return all.find(x=>x.sp===sp&&x.f===f&&x.t===t)}
 if(m=tk.match(/^([KQRBN]?)([a-h][1-8])[-x:]([a-h][1-8])$/)){const f=sqi(m[2]),t=sqi(m[3]);return all.find(x=>!x.sp&&x.f===f&&x.t===t&&b[f]&&(!m[1]||b[f].t===m[1].toLowerCase()))}
 if(m=tk.match(/^([KQRBN])?([a-h])?([1-8])?(x)?([a-h][1-8])$/)){const ty=m[1]?m[1].toLowerCase():'p',t=sqi(m[5]);
  return all.filter(x=>!x.sp&&x.t===t&&b[x.f].t===ty&&(!m[2]||(x.f&7)===F.indexOf(m[2]))&&(!m[3]||(x.f>>3)===m[3]-1)&&(ty!=='p'||(!!m[4])===((x.f&7)!==(x.t&7))))[0]}}
function parseGame(t){const meta={};t.replace(/\[(\w+)\s+"([^"]*)"\]/g,(a,k,v)=>{meta[k]=v;return''});
 let mt=t.replace(/\[[^\]]*\]/g,' ').replace(/\{[^}]*\}/g,' ').replace(/;[^\n]*/g,' ');for(let i=0;i<5;i++)mt=mt.replace(/\([^()]*\)/g,' ');
 mt=mt.replace(/\$\d+/g,' ').replace(/\d+\.(\.\.)?/g,' ').replace(/(1-0|0-1|1\/2-1\/2|\*)/g,' ');
 const tks=mt.split(/\s+/).filter(Boolean);if(!tks.length)return{err:'No moves found'};
 let b=fresh(),c='w';const mv=[];
 for(const tk of tks){let m;try{m=resolve(b,c,tk)}catch(e){return{err:String(e)}}
  if(!m)return{err:`Could not read move ${mv.length+1} ("${tk}"). It is not legal under Chessreal rules.`};mv.push(m);b=apply(b,m);c=c==='w'?'b':'w'}
 return{mv,meta}}
function buildGame(ms,meta){const g=newG();g.meta={w:meta.White||'White',b:meta.Black||'Black'};
 for(const m of ms){const c=g.turn,b=g.b,p=b[m.f],cap=!m.sp&&b[m.t];
  let s=m.sp?`R${sqn(m.f)}+${L[m.sp]||'P'}${sqn(m.t)}`:`${L[p.t]}${sqn(m.f)}${cap?'x':'-'}${sqn(m.t)}`;
  g.b=apply(b,m);const q=g.b[m.t];if(q.t!==(m.sp||p.t))s+='='+L[q.t];
  g.h.push(s);g.mvs.push(m);g.last=[m.f,m.t];g.snaps.push({b:g.b,last:g.last});g.turn=c==='w'?'b':'w'}
 g.st=status(g.b,g.turn);g.mv=gen(g.b,g.turn);
 if(g.st.over){g.over=1;g.res=g.st.res;g.why=g.st.why}else{g.res=meta.Result==='1-0'?'w':meta.Result==='0-1'?'b':meta.Result==='1/2-1/2'?'d':undefined;if(g.res)g.why='Result: '+meta.Result}
 g.view=0;return g}
function toCRM(g){const n0=g.meta||g.nm||{},r=g.res==='w'?'1-0':g.res==='b'?'0-1':g.res==='d'?'1/2-1/2':'*';
 const hd=[['Event','Chessreal game'],['Site','Chessreal'],['Date',new Date().toISOString().slice(0,10).replace(/-/g,'.')],['White',n0.w||'White'],['Black',n0.b||'Black'],['Result',r],['Variant','Chessreal'],['Format','CRM 1'],['PlyCount',g.h.length]];
 const tg=i=>g.tags&&g.tags[i]?' {'+g.tags[i].k+'}':'';let t=hd.map(x=>`[${x[0]} "${x[1]}"]`).join('\n')+'\n\n';
 for(let i=0;i<g.h.length;i+=2)t+=`${i/2+1}. ${g.h[i]}${tg(i)} ${g.h[i+1]?g.h[i+1]+tg(i+1):''} `;return t.trim()+' '+r}
/*CRM-END*/
function gl(){try{return JSON.parse(localStorage.getItem('crm_games'))||[]}catch(e){return memG}}
function gs(a){memG=a;try{localStorage.setItem('crm_games',JSON.stringify(a))}catch(e){}}
function saveGame(){const g=PG;if(!g||g.saved||!g.h.length)return;g.saved=1;const a=gl(),n0=g.nm||{};
 a.unshift({date:new Date().toISOString().slice(0,10).replace(/-/g,'.'),w:n0.w||'White',b:n0.b||'Black',res:g.res==='w'?'1-0':g.res==='b'?'0-1':g.res==='d'?'1/2-1/2':'*',n:Math.ceil(g.h.length/2),crm:toCRM(g)});gs(a.slice(0,40));if(tab==='analysis')renderGames()}
function renderGames(){const a=gl();$('#gl').innerHTML=a.length?a.map((g,i)=>`<div class="gr" data-gi="${i}"><span>${g.w} vs ${g.b}</span><b>${g.res}</b><span>${g.n} moves · ${g.date}</span></div>`).join(''):'<div style="opacity:.7;padding:4px 6px">No saved games yet. Finished games show up here.</div>'}
function loadText(t){const r=parseGame(t);if(r.err){if(tab!=='analysis')setTab('analysis');$('#lerr').textContent=r.err;return}
 AG=buildGame(r.mv,r.meta);setTab('analysis');$('#lerr').textContent=''}
function setTab(t){stopEng();reviewing=0;if(tab==='play'&&PG)PG.flip=flipV;tab=t;document.body.className='t-'+t;G=t==='play'?PG:AG;flipV=t==='play'?!!PG.flip:false;sel=spT=null;
 $('#pcs').innerHTML='';els.clear();build();render();ui();
 if(t==='analysis'){renderGames();rvui();analyze()}
 else if(!G.over&&S.mode==='bot'&&G.turn!==S.me)setTimeout(()=>{if(G===PG&&tab==='play'&&!G.over&&G.turn!==S.me)bot()},500)}
const wp=s=>1/(1+Math.exp(-s/25));
function minAtt(b,sq,c){let r=1e9;b.forEach((p,i)=>{if(p&&p.c===c&&pm(b,i,1).includes(sq))r=Math.min(r,V[p.t])});return r}
function classify(n){if(n<1)return;const A=G.an[n-1],B=G.an[n],m=G.mvs[n-1];if(!m||!A||!A.lines||!A.lines.length)return;
 const pl=A.pl!==undefined?A.pl:(B&&B.lines&&B.lines.length?-B.lines[0].s:null);if(pl==null)return;
 const best=A.lines[0].s,T=A.lines[0],isB=T.f===m.f&&T.t===m.t&&T.sp==m.sp,d=Math.max(0,wp(best)-wp(pl)),loss=Math.max(0,best-pl)/10,pb=G.snaps[n-1].b,ab=G.snaps[n].b,me=(n-1)%2?'b':'w',op=me==='w'?'b':'w',sg=me==='w'?1:-1;
 let sac=false;if(!m.sp&&B&&B.lines&&B.lines.length){const mp=pb[m.f],cv=pb[m.t]?V[pb[m.t].t]:0,ma=minAtt(ab,m.t,op),md=minAtt(ab,m.t,me);sac=V[mp.t]-cv>=20&&ma<1e9&&(md===1e9||ma<V[mp.t])&&B.lines[0].t!==m.t}
 let k;if(sac&&d<.03&&wp(best)<.8&&wp(pl)>.4)k='brilliant';
 else if(isB&&A.lines[1]&&wp(best)-wp(A.lines[1].s)>=.15)k='great';
 else if(isB||d<.005)k='best';else if(d<.03)k='excellent';else if(d<.07)k='good';else if(d<.12)k='inaccuracy';else if(d<.25)k='mistake';else k='blunder';
 const pt=G.tags[n-2];if(pt&&(pt.k==='mistake'||pt.k==='blunder')&&(k==='inaccuracy'||k==='mistake'))k='miss';
 const s=nm(pb,m),bs=nm(pb,T),M={miss:`${s} misses a chance. After the previous slip, ${bs} was far stronger.`,brilliant:`${s} is brilliant! A real sacrifice that still holds up: taking the piece backfires.`,great:`${s} is a great find: the only move that keeps your position strong.`,best:`${s} is the engine's top choice.`,excellent:`${s} is excellent, almost the best.`,good:`${s} is good. The engine slightly prefers ${bs}.`,inaccuracy:`${s} is an inaccuracy. ${bs} was better (${fmt(sg*best)}).`,mistake:`${s} is a mistake, costing ~${loss.toFixed(1)} pawns. Best was ${bs}.`,blunder:`${s} is a blunder, costing ~${loss.toFixed(1)} pawns! Best was ${bs}.`};
 G.tags[n-1]={k,msg:M[k]}}
function arr(m,col,w,op){const p=i=>{const f=i&7,y=i>>3;return[((flipV?7-f:f)+.5)*100,((flipV?y:7-y)+.5)*100]},[x1,y1]=p(m.f),[x2,y2]=p(m.t),dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l,hx=x2-ux*24,hy=y2-uy*24,sx=x1+ux*20,sy=y1+uy*20;
 return`<g fill="${col}" stroke="${col}" opacity="${op}"><line x1="${sx}" y1="${sy}" x2="${hx}" y2="${hy}" stroke-width="${w}" stroke-linecap="round"${m.sp?' stroke-dasharray="14 10"':''}/><polygon stroke="none" points="${x2-ux*4},${y2-uy*4} ${hx-uy*(w+9)},${hy+ux*(w+9)} ${hx+uy*(w+9)},${hy-ux*(w+9)}"/></g>`}
function draw(){const n=VI(),A=G.an[n],ok=tab==='analysis'&&S.eng&&A&&A.lines&&A.lines.length>0,live=G.view==null;
 $('.eb').style.display=tab==='analysis'&&S.eng?'':'none';let sv='';
 if(ok&&!(live&&G.over))A.lines.slice(0,3).forEach((m,i)=>sv+=arr(m,['#7fd13b','#3b9bff','#f0a030'][i],[15,11,9][i],[.9,.7,.55][i]));
 $('#ar').innerHTML=sv;
 let sw=null;if(live&&G.over)sw=G.res==='w'?9999:G.res==='b'?-9999:0;else if(ok)sw=(n%2?-1:1)*A.lines[0].s;
 const w=$('#ebw');if(sw!=null){w.style.height=100/(1+Math.exp(-sw/25))+'%';$('#ebl').textContent=fmt(sw)}
 w.style.top=flipV?'0':'auto';w.style.bottom=flipV?'auto':'0';
 const t=n>0&&tab==='analysis'&&S.eng&&G.tags[n-1],tg=$('#tg');tg.style.display=t?'block':'none';
 if(t){tg.style.transform=pos(G.snaps[n].last[1]);const s=tg.firstChild,k=n+t.k;s.innerHTML=tgx(t.k);s.style.background=TG[t.k][1];if(tg.dataset.k!==k){tg.dataset.k=k;s.classList.remove('in');void s.offsetWidth;s.classList.add('in')}}}
function anui(){const n=VI(),A=G.an[n];$('#engb').textContent=S.eng?'On':'Off';$('#anb').style.display=S.eng?'':'none';$('#tmv').textContent=S.sec+'s';
 if(!S.eng){$('#dep').textContent='';return}
 const b=G.snaps[n].b,sg=n%2?-1:1;let h='';
 if(A&&A.lines)h=A.lines.slice(0,3).map((m,i)=>`<div class="ln"><b style="background:${['#7fd13b','#3b9bff','#f0a030'][i]}"></b><span>${fmt(sg*m.s)}</span><span>${nm(b,m)}</span></div>`).join('');
 $('#lines').innerHTML=h||'<div class="ln">Analyzing...</div>';
 $('#dep').textContent=A?`Depth ${A.d||0} · ${A.done?'done':'thinking...'}`:'Waiting...';
 const t=n>0&&G.tags[n-1];$('#tgm').innerHTML=t?`<span class="chip" style="background:${TG[t.k][1]}">${tgx(t.k,18)}</span> ${t.msg}`:'';if(!$('#lg').firstChild)$('#lg').innerHTML=Object.keys(TG).map(k=>`<span class="lc"><i style="background:${TG[k][1]}">${tgx(k,18)}</i>${TG[k][2]}</span>`).join('')}
function refresh(){ui();draw()}
function goV(v){G.view=v>=G.h.length?null:v;sel=spT=null;render();ui();analyze()}
document.addEventListener('keydown',e=>{if(!G||$('#modal').classList.contains('show'))return;const n=VI();if(e.key==='ArrowLeft')goV(Math.max(0,n-1));else if(e.key==='ArrowRight')goV(Math.min(G.h.length,n+1))});

/* ---- modals ---- */
const modal=h=>{$('#card').innerHTML=h;icons($('#card'));$('#modal').classList.add('show')};
function showMenu(){modal(`<h2><i data-ic="crown"></i> Chessreal</h2><p>Chess with leaping knights, roaming kings and spawning rooks.</p>
 <div class="r">Mode</div><div class="seg" data-g="mode"><button data-v="bot" class="${S.mode==='bot'?'on':''}"><i data-ic="bot"></i> Computer</button><button data-v="pvp" class="${S.mode==='pvp'?'on':''}"><i data-ic="users"></i> 1v1</button></div>
 <div class="bo ${S.mode==='bot'?'':'hide'}"><div class="r">You play</div><div class="seg" data-g="me">${[['w','White'],['b','Black'],['r','Random']].map(a=>`<button data-v="${a[0]}" class="${S.me===a[0]?'on':''}">${a[1]}</button>`).join('')}</div>
 <div class="r">Difficulty</div><div class="seg" data-g="diff"><button data-v="easy" class="${S.diff==='easy'?'on':''}">Easy</button><button data-v="hard" class="${S.diff==='hard'?'on':''}">Hard</button></div></div>
 <button class="go" data-act="start"><i data-ic="play"></i> Play</button>`)}
function showRules(){modal(`<h2><i data-ic="book"></i> Rules</h2><ul>
 <li><b>Knights</b> leap to any square within a 2.5 radius.</li><li><b>Kings</b> move up to 3 squares sideways and 2 vertically (and can be captured).</li>
 <li><b>Rooks</b> show a countdown. After 8 of your turns it turns ★ (16 turns for a queen, ★★): select it, pick a piece, tap an adjacent empty square (this uses your turn).</li>
 <li><b>Lost king?</b> Carry on, and promote a pawn at the far rank to a king.</li>
 <li><b>Checkmate:</b> your king is attacked, every pawn is attacked and no move makes the king safe.</li>
 <li><b>Draw:</b> no king, only pawns, and every pawn is blocked (an enemy piece sits on its promotion square). If those pawns are also attacked, it's checkmate.</li>
 <li>No king, no pawns and no rooks means you lose.</li><li><b>Analysis tab:</b> load a saved game, or paste a PGN / CRM. You get an eval bar, arrows for the top 3 moves (green is best) and a tag on every move from Brilliant to Blunder. Click a move or use the arrow keys to step through.</li></ul><button class="go" data-act="close">Got it</button>`)}
function showOver(){const r=G.res,w=S.mode==='bot'?(r==='d'?'Draw':r===S.me?'You win!':'You lose'):(r==='d'?'Draw':(r==='w'?'White':'Black')+' wins!');
 modal(`<h2><i data-ic="crown"></i> ${w}</h2><p>${G.why}</p><button class="go" data-act="anal">Analyze game</button><button class="go" style="background:var(--p2);color:var(--tx)" data-act="menu">New game</button><button class="go" style="background:var(--p2);color:var(--tx)" data-act="close">Review board</button>`)}
function start(){if(S.mode==='bot'&&S.me==='r')S.me=Math.random()<.5?'w':'b';
 if(tab!=='play')setTab('play');if(PG&&!PG.saved&&PG.h.length>=2)saveGame();stopEng();uid=0;G=PG=newG();G.nm={w:S.mode==='bot'?(S.me==='w'?'You':'Computer'):'White',b:S.mode==='bot'?(S.me==='b'?'You':'Computer'):'Black'};sel=spT=null;flipV=S.mode==='bot'&&S.me==='b';$('#pcs').innerHTML='';els.clear();build();G.st=status(G.b,'w');render();ui();$('#modal').classList.remove('show');
 if(S.mode==='bot'&&S.me==='b'){const g=G;setTimeout(()=>{if(g===G)bot()},700)}}
document.addEventListener('click',e=>{const t=e.target,a=t.closest('[data-act]'),sg=t.closest('.seg button'),sp=t.closest('[data-sp]');

 if(sg){const g=sg.parentNode.dataset.g;S[g]=sg.dataset.v;if(g==='mode'||g==='me'){const m=S.me==='r'?'r':S.me;showMenu()}else sg.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===sg));return}
 if(sp){spT=spT===sp.dataset.sp?null:sp.dataset.sp;render();return}
 if(a){const k=a.dataset.act;if(k==='start')start();else if(k==='menu')showMenu();else if(k==='rules')showRules();else if(k==='close')$('#modal').classList.remove('show');
  else if(k==='load')loadText($('#pgn').value);else if(k==='review')review();else if(k==='anal'){$('#modal').classList.remove('show');loadText(toCRM(PG))}
  else if(k==='export'){const x=toCRM(G);$('#pgn').value=x;document.querySelector('[data-lt="paste"]').click();try{navigator.clipboard.writeText(x)}catch(e){}}
  else if(k==='eng'){S.eng=!S.eng;if(S.eng)analyze();else stopEng();render();ui()}
  else if(k==='flip'){flipV=!flipV;build();render();ui()}

 const d=t.closest('.s');if(!d||!canHuman())return;const i=+d.dataset.i,p=G.b[i];

 if(m){play(m);return}

PG=G=newG();G.st=status(G.b,'w');AG=newG();AG.st=status(AG.b,'w');AG.meta={w:'White',b:'Black'};document.body.className='t-play';build();render();ui();icons(document);showMenu();
